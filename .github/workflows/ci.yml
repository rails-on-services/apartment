name: CI

on:
  push:
    branches: [main, '*-stable']
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ruby:
        description: 'Ruby version (all, 3.3, 3.4, 4.0)'
        required: false
        default: 'all'
        type: choice
        options: ['all', '3.3', '3.4', '4.0']
      rails:
        description: 'Rails version (all, 7.2, 8.0, 8.1)'
        required: false
        default: 'all'
        type: choice
        options: ['all', '7.2', '8.0', '8.1']
      engine:
        description: 'Database engine (all, postgresql, mysql, sqlite)'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'postgresql', 'mysql', 'sqlite']

jobs:
  # ── Unit tests (no database required) ──────────────────────────────
  # Also runs spec/unit/rspec_rails_lifecycle_spec.rb and spec/unit/railtie_spec.rb
  # across the full matrix — both self-require heavy deps (rspec-rails, rails)
  # because spec_helper.rb stays Rails-free. The appraisal gemfiles carry the
  # deps. {RSPEC_RAILS,RAILTIE_SPEC}_REQUIRED turn a missing dep into a hard
  # failure rather than a silent skip (railtie_spec silently pended for months
  # without it, masking a real bug in header_trust_warning?).
  unit:
    name: Unit · Ruby ${{ matrix.ruby }} · Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed ~30s
    # Rails main is a canary: it tracks an unreleased edge and is allowed to
    # fail. continue-on-error keeps a red main cell from failing the `unit` job,
    # so it neither blocks the workflow nor flips needs.unit.result for ci-gate.
    continue-on-error: ${{ matrix.rails == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ github.event_name == 'workflow_dispatch' && inputs.ruby != 'all' && fromJSON(format('["{0}"]', inputs.ruby)) || fromJSON('["3.3","3.4","4.0"]') }}
        rails: ${{ github.event_name == 'workflow_dispatch' && inputs.rails != 'all' && fromJSON(format('["{0}"]', inputs.rails)) || fromJSON('["7.2","8.0","8.1","main"]') }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_sqlite3.gemfile
      RSPEC_RAILS_REQUIRED: '1'
      RAILTIE_SPEC_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit specs
        run: bundle exec rspec spec/unit/ --format progress

  # ── PostgreSQL integration tests ───────────────────────────────────
  postgresql:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'postgresql' }}
    name: PG ${{ matrix.pg }} · Ruby ${{ matrix.ruby }} · Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed ~2m
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ github.event_name == 'workflow_dispatch' && inputs.ruby != 'all' && fromJSON(format('["{0}"]', inputs.ruby)) || fromJSON('["3.3","3.4","4.0"]') }}
        rails: ${{ github.event_name == 'workflow_dispatch' && inputs.rails != 'all' && fromJSON(format('["{0}"]', inputs.rails)) || fromJSON('["7.2","8.0","8.1"]') }}
        pg: ['16', '18']
        exclude:
          # Reduce matrix: test oldest PG with oldest Rails, newest with newest
          - pg: '16'
            rails: '8.1'
          - pg: '18'
            rails: '7.2'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_postgresql.gemfile
      CI: true
      RAILS_ENV: test
      DATABASE_ENGINE: postgresql
      # request_lifecycle_spec skips if the dummy app or rack-test fails to
      # load. This flag turns that skip into a hard failure here, where the
      # spec must run — it silently skipped in CI for months otherwise.
      REQUEST_LIFECYCLE_REQUIRED: '1'
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: apartment_v4_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Provision RBAC test roles
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres --set ON_ERROR_STOP=on <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'apt_test_db_manager') THEN
                CREATE ROLE apt_test_db_manager LOGIN CREATEDB;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'apt_test_app_user') THEN
                CREATE ROLE apt_test_app_user LOGIN;
              END IF;
            END $$;
            GRANT apt_test_app_user TO apt_test_db_manager;
          SQL
      - name: Run v4 integration tests
        # request_lifecycle_spec boots a full Rails app and is run in its own
        # rspec process below — it must not share a process with the other
        # integration specs, which swap the AR connection handler for isolation.
        # Interleaved, that produces order-dependent failures (see CI seed 3846).
        run: bundle exec rspec spec/integration/v4/ --exclude-pattern "**/request_lifecycle_spec.rb" --format progress
        env:
          DATABASE_ENGINE: postgresql
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Run request lifecycle spec (isolated)
        run: bundle exec rspec spec/integration/v4/request_lifecycle_spec.rb --format documentation
        env:
          DATABASE_ENGINE: postgresql
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Verify RBAC specs ran (not silently skipped)
        run: |
          count=$(bundle exec rspec spec/integration/v4/ --exclude-pattern "**/request_lifecycle_spec.rb" --tag rbac --format json 2>/dev/null | tail -1 | ruby -rjson -e 'puts JSON.parse(STDIN.read)["summary"]["example_count"]')
          echo "RBAC examples ran: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::All RBAC examples were skipped — role provisioning may have failed"
            exit 1
          fi
        env:
          DATABASE_ENGINE: postgresql
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres

  # ── MySQL integration tests ────────────────────────────────────────
  mysql:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'mysql' }}
    name: MySQL 8.4 · Ruby ${{ matrix.ruby }} · Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # observed ~3.5m
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ github.event_name == 'workflow_dispatch' && inputs.ruby != 'all' && fromJSON(format('["{0}"]', inputs.ruby)) || fromJSON('["3.3","3.4","4.0"]') }}
        rails: ${{ github.event_name == 'workflow_dispatch' && inputs.rails != 'all' && fromJSON(format('["{0}"]', inputs.rails)) || fromJSON('["7.2","8.0","8.1"]') }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_mysql2.gemfile
      CI: true
      RAILS_ENV: test
      DATABASE_ENGINE: mysql
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: apartment_mysql_test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Provision RBAC test roles
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -u root <<'SQL'
            CREATE USER IF NOT EXISTS 'apt_test_db_manager'@'%';
            CREATE USER IF NOT EXISTS 'apt_test_app_user'@'%';
            GRANT ALL PRIVILEGES ON *.* TO 'apt_test_db_manager'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          SQL
      - name: Run v4 integration tests
        run: bundle exec rspec spec/integration/v4/ --format progress
        env:
          DATABASE_ENGINE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
      - name: Verify RBAC specs ran (not silently skipped)
        run: |
          count=$(bundle exec rspec spec/integration/v4/ --tag rbac --format json 2>/dev/null | tail -1 | ruby -rjson -e 'puts JSON.parse(STDIN.read)["summary"]["example_count"]')
          echo "RBAC examples ran: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::All RBAC examples were skipped — role provisioning may have failed"
            exit 1
          fi
        env:
          DATABASE_ENGINE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root

  # ── SQLite integration tests ───────────────────────────────────────
  sqlite:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'sqlite' }}
    name: SQLite · Ruby ${{ matrix.ruby }} · Rails ${{ matrix.rails }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed ~70s
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ github.event_name == 'workflow_dispatch' && inputs.ruby != 'all' && fromJSON(format('["{0}"]', inputs.ruby)) || fromJSON('["3.3","3.4","4.0"]') }}
        rails: ${{ github.event_name == 'workflow_dispatch' && inputs.rails != 'all' && fromJSON(format('["{0}"]', inputs.rails)) || fromJSON('["7.2","8.0","8.1"]') }}
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_${{ matrix.rails }}_sqlite3.gemfile
      CI: true
      RAILS_ENV: test
      DATABASE_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run v4 integration tests
        run: bundle exec rspec spec/integration/v4/ --format progress
        env:
          DATABASE_ENGINE: sqlite

  # ── PgBouncer transaction-mode safety ──────────────────────────────
  # Guards docs/connection-poolers.md. With the :schema strategy, PgBouncer in
  # transaction mode can silently serve one tenant another tenant's rows unless
  # search_path is tracked — and it can only be tracked on PG 18+, which is the
  # first release that reports search_path to clients.
  #
  # Both PG versions are in the matrix on purpose: 18 proves the fix works, 16
  # proves the version floor is real. The spec asserts the LEAKING cases too, so
  # if PostgreSQL or PgBouncer changes this behaviour underneath us the build goes
  # red and we correct the docs instead of shipping a stale claim about isolation.
  pgbouncer:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'postgresql' }}
    name: PgBouncer tx-mode · PG ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # observed ~50s
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '18'] # 16 = version floor (must leak), 18 = supported (must isolate)
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_8.1_postgresql.gemfile
      CI: true
      RAILS_ENV: test
      DATABASE_ENGINE: postgresql
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: apartment_v4_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # A mirror stall here once hung for 18 minutes and produced an empty log, because
      # -qq suppresses everything and the job inherited the 360-minute default. Three
      # changes, addressing cause then symptom: apt gets its own connect timeout and
      # retries so a bad mirror fails instead of blocking; update keeps its output so
      # there is something to read; and the step is capped well above the ~15s the
      # install actually takes.
      - name: Install PgBouncer
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y -qq $APT_OPTS pgbouncer
          pgbouncer --version
          # track_extra_parameters arrived in PgBouncer 1.20. Below that the safe
          # configuration cannot even be expressed, so fail loudly rather than
          # "passing" a suite that silently tested nothing.
          ver=$(pgbouncer --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ "$(printf '%s\n1.20\n' "$ver" | sort -V | head -1)" != "1.20" ]; then
            echo "::error::PgBouncer $ver predates 1.20 — track_extra_parameters unavailable"
            exit 1
          fi

      - name: Start two PgBouncer instances (safe on 7432, default on 7433)
        run: |
          # The Ubuntu package installs AND starts a pgbouncer on the default port
          # (6432). Stop it and use 7432/7433 so we can never bind against it.
          sudo systemctl stop pgbouncer 2>/dev/null || true
          mkdir -p /tmp/pgb
          printf '"postgres" ""\n' > /tmp/pgb/userlist.txt

          # $1 = listen port, $2 = optional extra directive
          write_ini() {
            {
              echo "[databases]"
              echo "apartment_v4_test = host=127.0.0.1 port=5432 dbname=apartment_v4_test"
              echo ""
              echo "[pgbouncer]"
              echo "listen_addr = 127.0.0.1"
              echo "listen_port = $1"
              echo "auth_type = trust"
              echo "auth_file = /tmp/pgb/userlist.txt"
              echo "pool_mode = transaction"
              # ONE backend, so both tenants are forced to share it. Without this the
              # clients may never meet and the isolation test would prove nothing.
              echo "default_pool_size = 1"
              echo "max_client_conn = 50"
              echo "logfile = /tmp/pgb/pgbouncer-$1.log"
              echo "pidfile = /tmp/pgb/pgbouncer-$1.pid"
              # if/fi, not `[ -n "$2" ] && echo`: the latter returns 1 for an empty $2,
              # and steps run under `bash -e`, so the unsafe config would kill the step.
              if [ -n "$2" ]; then echo "$2"; fi
            } > "/tmp/pgb/pgbouncer-$1.ini"
          }

          write_ini 7432 'track_extra_parameters = IntervalStyle,search_path'  # documented SAFE config
          write_ini 7433 ''                                                    # PgBouncer defaults

          pgbouncer -d /tmp/pgb/pgbouncer-7432.ini
          pgbouncer -d /tmp/pgb/pgbouncer-7433.ini

          for port in 7432 7433; do
            ready=0
            for _ in $(seq 1 20); do
              if psql -h 127.0.0.1 -p "$port" -U postgres -d apartment_v4_test -c 'SELECT 1' >/dev/null 2>&1; then
                ready=1; break
              fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::PgBouncer on port $port never became ready"
              cat "/tmp/pgb/pgbouncer-$port.log" || true
              exit 1
            fi
            echo "PgBouncer ready on $port"
          done

      - name: Run PgBouncer safety spec
        run: bundle exec rspec spec/integration/v4/pgbouncer_spec.rb --format documentation
        env: &pgbouncer_env
          DATABASE_ENGINE: postgresql
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: apartment_v4_test
          PGBOUNCER_SAFE_PORT: '7432'
          PGBOUNCER_UNSAFE_PORT: '7433'
          # Turns a silent skip into a hard failure here, where the poolers must exist.
          # A skipped tenant-isolation test that reports green is the failure mode this
          # job exists to prevent (spec/CLAUDE.md, "CI hard-fail flags").
          PGBOUNCER_REQUIRED: '1'

      - name: Dump PgBouncer logs on failure
        if: failure()
        run: tail -n 50 /tmp/pgb/pgbouncer-*.log || true

  # ── CI gate ────────────────────────────────────────────────────────
  # Single aggregation check for branch protection: require just `ci-gate`
  # rather than every matrix cell by name (which would break whenever the
  # matrix changes and risk pinning the Rails-main canary). Passes only when
  # every required job succeeded or was skipped — skipped happens only under a
  # scoped workflow_dispatch, never on the pull_request events that gate merges.
  # Job results arrive via env (not interpolated into run:) so the shell never
  # evaluates workflow context directly.
  ci-gate:
    if: always()
    needs: [unit, postgresql, mysql, sqlite, pgbouncer]
    runs-on: ubuntu-latest
    timeout-minutes: 5 # observed ~3s
    env:
      UNIT: ${{ needs.unit.result }}
      POSTGRESQL: ${{ needs.postgresql.result }}
      MYSQL: ${{ needs.mysql.result }}
      SQLITE: ${{ needs.sqlite.result }}
      PGBOUNCER: ${{ needs.pgbouncer.result }}
    steps:
      - name: Require all CI jobs to have passed
        run: |
          failed=0
          for job in UNIT POSTGRESQL MYSQL SQLITE PGBOUNCER; do
            result="${!job}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::Required CI job '$job' concluded '$result'"
              failed=1
            fi
          done
          if [ "$failed" -eq 0 ]; then echo "All required CI jobs passed."; fi
          exit "$failed"
